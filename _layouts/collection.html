---
layout: archive
---

{{ content }}

{% assign entries_layout = page.entries_layout | default: 'grid' %}
<div class="entries-{{ entries_layout }}">
  {% include documents-collection.html collection=page.collection sort_by=page.sort_by sort_order=page.sort_order type=entries_layout %}
</div>
<style>
  /* Basic styling for grid and overlays */
  .entries-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr); /* Default is three columns */
    gap: 20px;
  }
  
  @media (max-width: 900px) {
    .entries-grid {
      grid-template-columns: repeat(2, 1fr); /* Two columns on medium screens */
    }
  }
  
  @media (max-width: 600px) {
    .entries-grid {
      grid-template-columns: 1fr; /* One column on small screens */
    }
  }
  
  .project-card {
    position: relative;
    overflow: hidden;
    border-radius: 8px;
  }
  
  .project-card img {
    width: 100%;
    height: auto;
    display: block;
  }
  
  .project-card .overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.5);
    color: white;
    display: flex; /* Use Flexbox to center content */
    align-items: center; /* Vertically center */
    justify-content: center; /* Horizontally center */
    opacity: 0;
    transition: opacity 0.3s ease;
    text-align: center; /* Center text within the overlay */
    padding: 10px; /* Optional: Add padding for text */
  }
  
  .project-card:hover .overlay {
    opacity: 1;
  }
  </style>
